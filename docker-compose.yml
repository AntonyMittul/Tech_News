services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signal-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://signal:signal@postgres:5432/tech_news
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CRON_SECRET=${CRON_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: signal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tech_news
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "5433:5432"
    volumes:
      - signal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d tech_news"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signal_postgres_data:
