name: 3-Hour Feed Refresh

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Ingestion
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://tech-news-fawn-ten.vercel.app"
          fi
          AUTH_HEADER=""
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          fi
          echo "Triggering ingestion on $TARGET_URL..."
          curl -s -f -H "$AUTH_HEADER" "$TARGET_URL/api/cron/refresh" || echo "Ingestion request completed"
      - name: Trigger AI Enrichment
        run: |
          TARGET_URL="${{ secrets.PRODUCTION_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://tech-news-fawn-ten.vercel.app"
          fi
          AUTH_HEADER=""
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            AUTH_HEADER="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          fi
          echo "Triggering enrichment on $TARGET_URL..."
          curl -s -f -H "$AUTH_HEADER" "$TARGET_URL/api/cron/enrich" || echo "Enrichment request completed"
